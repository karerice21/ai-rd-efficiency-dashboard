<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>登录｜AI 研发效能度量平台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/login.css?v=20260904.1" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="login-mark">AI</div>
        <span class="login-eyebrow">ENGINEERING INTELLIGENCE CENTER</span>
        <h1 id="loginTitle">AI 研发效能度量平台</h1>
        <p>请输入账号和密码后继续。</p>
        <form id="loginForm">
          <label>
            <span>账号</span>
            <input id="username" name="username" autocomplete="username" required autofocus />
          </label>
          <label>
            <span>密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <p id="loginError" class="login-error" role="alert" hidden></p>
          <button id="loginButton" type="submit">登录系统</button>
        </form>
      </section>
    </main>
    <script>
      const form = document.querySelector("#loginForm");
      const error = document.querySelector("#loginError");
      const button = document.querySelector("#loginButton");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.hidden = true;
        button.disabled = true;
        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.querySelector("#username").value,
              password: document.querySelector("#password").value,
            }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.detail || "登录失败，请稍后重试");
          window.location.replace("/");
        } catch (exception) {
          error.textContent = exception.message;
          error.hidden = false;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
